  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

h2,h3,h4{font-family:'Poppins',sans-serif;color:var(--navy);line-height:1.12;letter-spacing:-.01em}\n  a{text-decoration:none;color:inherit}\n  img{display:block;max-width:100%}\n  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}\n  .accent{color:var(--sky)}\n  .eyebrow{\n    font-family:'DM Sans';font-weight:700;font-size:.8rem;letter-spacing:.16em;\n    text-transform:uppercase;color:var(--brand-600);display:inline-flex;align-items:center;gap:10px;\n  }\n  .eyebrow::before{content:\"\";width:26px;height:2px;background:var(--sky);border-radius:2px}\n  .section{padding:96px 0}\n  .section-head{max-width:680px;margin:0 auto 56px;text-align:center}\n  .section-head h2{font-size:clamp(1.9rem,3.6vw,2.9rem);font-weight:700;margin:16px 0 14px}\n  .section-head p{color:var(--muted);font-size:1.05rem}\n\n  /* Buttons */\n  .btn{\n    display:inline-flex;align-items:center;gap:10px;font-family:'DM Sans';font-weight:600;\n    font-size:.98rem;padding:14px 26px;border-radius:999px;cursor:pointer;border:none;\n    transition:transform .2s ease,box-shadow .2s ease,background .2s ease;white-space:nowrap;\n  }\n  .btn-primary{background:linear-gradient(135deg,var(--brand-600),var(--sky));color:#fff;box-shadow:0 14px 30px -12px rgba(47,134,235,.7)}\n  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 40px -14px rgba(47,134,235,.85)}\n  .btn-ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line);box-shadow:var(--shadow-sm)}\n  .btn-ghost:hover{transform:translateY(-2px);border-color:var(--sky);color:var(--brand-600)}\n  .ico{width:18px;height:18px;flex:none}\n\n  /* ===== Header ===== */\n  header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}\n  header.scrolled{border-color:var(--line);box-shadow:var(--shadow-sm)}\n  .nav{display:flex;align-items:center;justify-content:space-between;height:78px}\n  .brand{display:flex;align-items:center;gap:12px}\n  .brand img{height:42px;width:auto}\n  .brand .name{font-family:'Poppins';font-weight:700;font-size:1.32rem;color:var(--brand);letter-spacing:-.02em}\n  .brand .name b{color:var(--sky);font-weight:700}\n  nav ul{display:flex;align-items:center;gap:34px;list-style:none}\n  nav ul a{font-weight:500;color:var(--ink);font-size:.97rem;position:relative;padding:6px 0;transition:color .2s}\n  nav ul a::after{content:\"\";position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--sky);transition:width .25s;border-radius:2px}\n  nav ul a:hover{color:var(--brand-600)}\n  nav ul a:hover::after{width:100%}\n  .nav-cta{display:flex;align-items:center;gap:16px}\n  .nav-cta .btn{padding:11px 22px}\n  .menu-btn{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:8px}\n  .menu-btn span{width:24px;height:2.5px;background:var(--navy);border-radius:3px;transition:.3s}\n\n  /* ===== Hero ===== */\n  .hero{position:relative;padding:64px 0 86px;background:\n      radial-gradient(900px 480px at 90% -10%, #eef4fe 0%, rgba(238,244,254,0) 60%),\n      linear-gradient(180deg,#fbfcff 0%,#fff 100%);overflow:hidden}\n  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}\n  .hero h1{font-size:clamp(2.4rem,5vw,4rem);font-weight:800;letter-spacing:-.025em}\n  .hero h1 .accent{display:inline-block}\n  .hero .badge{\n    display:inline-flex;align-items:center;gap:10px;margin:26px 0;padding:13px 20px;\n    background:linear-gradient(180deg,#fff,#f3f7ff);border:1px solid var(--line);\n    border-left:4px solid var(--sky);border-radius:12px;box-shadow:var(--shadow-sm);\n    font-weight:600;color:var(--navy);font-size:.96rem;\n  }\n  .hero p.lead{color:var(--muted);font-size:1.08rem;max-width:540px;margin-bottom:34px}\n  .hero-cta{display:flex;gap:16px;flex-wrap:wrap}\n  .hero-stats{display:flex;gap:34px;margin-top:42px;flex-wrap:wrap}\n  .hero-stats .s b{font-family:'Poppins';font-weight:700;font-size:1.7rem;color:var(--brand);display:block;line-height:1}\n  .hero-stats .s span{font-size:.86rem;color:var(--muted);font-weight:500}\n\n  /* Hero visual */\n  .hero-visual{position:relative;display:flex;justify-content:center}\n  .blob1{position:absolute;width:120px;height:120px;border-radius:50%;background:var(--sky-soft);top:-18px;right:6%;z-index:0}\n  .blob2{position:absolute;width:90px;height:90px;border-radius:50%;background:#eafaf2;bottom:30px;left:-6px;z-index:0}\n  .photo-frame{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(440px,100%);z-index:1}\n  .tile{position:relative;aspect-ratio:1/1.08;border-radius:18px;overflow:hidden;\n    background:linear-gradient(150deg,var(--brand-600),var(--sky));box-shadow:var(--shadow)}\n  .tile:nth-child(1){border-top-left-radius:42px}\n  .tile:nth-child(2){border-top-right-radius:42px}\n  .tile:nth-child(3){border-bottom-left-radius:42px}\n  .tile:nth-child(4){border-bottom-right-radius:42px}\n  .ph{position:relative;width:100%;height:100%;\n    background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.10) 0 10px,rgba(255,255,255,0) 10px 20px);\n    display:flex;align-items:flex-end;justify-content:center;padding:12px}\n  .ph span{font-family:'DM Mono',ui-monospace,monospace;font-size:.62rem;letter-spacing:.06em;\n    color:rgba(255,255,255,.85);text-transform:uppercase;background:rgba(12,22,68,.28);\n    padding:4px 9px;border-radius:6px}\n  .placed-pill{position:absolute;bottom:-26px;right:8px;z-index:3;display:flex;align-items:center;gap:12px;\n    background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px 9px 14px;box-shadow:var(--shadow)}\n  .placed-pill .num{font-family:'Poppins';font-weight:700;color:var(--brand);font-size:1.05rem;line-height:1}\n  .placed-pill .num small{display:block;font-family:'DM Sans';font-weight:500;color:var(--muted);font-size:.62rem;letter-spacing:.08em}\n  .avatars{display:flex}\n  .avatars i{width:32px;heig
